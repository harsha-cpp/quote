name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js
          test -f lambda/index.js
          test -f README.md

      - name: Check JavaScript syntax
        run: |
          node --check frontend/script.js
          node --check lambda/index.js

      - name: Check app text
        run: |
          grep -q "Get Quote" frontend/index.html
          grep -q 'const apiUrl = "https://' frontend/script.js
          grep -q "fetch(apiUrl" frontend/script.js

  deploy-lambda:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda
        run: zip -j lambda.zip lambda/index.js

      - name: Deploy Lambda
        run: aws lambda update-function-code --function-name "${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}" --zip-file fileb://lambda.zip
